{{$round := .}}
{{with $black := $round.BlackCard}}
<div class="card-face card-face-black mb-4">
  <div class="card-copy">{{$black.HTML}}</div>
  <div class="card-footer-row">
    <small class="opacity-75">pick {{$black.Pick}}{{if gt $black.Draw 0}} · draw {{$black.Draw}}{{end}}</small>
    <small class="opacity-60 fst-italic">{{$round.Footnote}}</small>
  </div>
</div>
{{end}}
