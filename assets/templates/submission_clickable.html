{{with .Dot}}
{{$cards := .Cards}}
{{if $cards}}
  {{if eq (len $cards) 1}}
    {{range $cards}}
      {{template "white_card_body.html" .}}
    {{end}}
  {{else}}
  <div class="submission-stack">
    {{range $cards}}
    <div class="submission-card">
      {{template "white_card_body.html" .}}
    </div>
    {{end}}
  </div>
  {{end}}
{{end}}
{{end}}
